<!doctype html><html lang="lt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f7d6d"><title>Pertraukos</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3f6f4;--card:#fff;--tx:#1d2b27;--mu:#5d6f69;--ac:#2f7d6d;--ac2:#e0efe9;--wr:#c0563b}
@media(prefers-color-scheme:dark){:root{--bg:#14201d;--card:#1d2c28;--tx:#e6efec;--mu:#9db0aa;--ac:#4fb39c;--ac2:#25403a;--wr:#e67e5f}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:24px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
h1{margin:4px 0;font-size:1.5rem;font-weight:600;text-align:center}
.card{background:var(--card);border-radius:24px;padding:22px;text-align:center;box-shadow:0 2px 12px #0001}
.time{font-size:4.2rem;font-weight:300;font-variant-numeric:tabular-nums;margin:6px 0}
.mu{color:var(--mu)}button{font:inherit;border:0;border-radius:18px;cursor:pointer}
.big{width:100%;padding:26px;font-size:1.7rem;font-weight:600;background:var(--ac);color:#fff}
.sec{width:100%;padding:18px;font-size:1.2rem;background:var(--ac2);color:var(--tx)}
.row{display:flex;gap:10px}.row>*{flex:1}
.dur button{padding:14px;font-size:1.1rem;background:var(--ac2);color:var(--tx)}.dur button.on{background:var(--ac);color:#fff}
.hint{font-size:.95rem;color:var(--mu);text-align:center;padding:0 8px}
.alarm{background:var(--wr);color:#fff;animation:p 1s infinite}@keyframes p{50%{opacity:.75}}
.emo{font-size:5rem;line-height:1.2}
#exFig{width:100%;height:210px;display:block}#exFig .fg{stroke:var(--ac);stroke-width:7;stroke-linecap:round;fill:none}#exFig .bk{opacity:.4}#exFig .hd{fill:var(--card);stroke:var(--ac);stroke-width:6}#exFig .pr{stroke:var(--mu);stroke-width:4;fill:none;stroke-linecap:round;opacity:.6}#exFig .sl{stroke:var(--ac);stroke-width:2.5;stroke-dasharray:5 6;animation:sl 1s linear infinite}@keyframes sl{to{stroke-dashoffset:-22}}.hidden{display:none!important}
section{display:flex;flex-direction:column;gap:16px}.dur button:disabled{opacity:.45;cursor:default}
.bar{height:8px;background:var(--ac2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0}
</style></head><body><main>
<h1>Pertraukos</h1>
<section id="vHome">
 <div class="card"><div class="mu" id="stLbl">Sėdėjimo laikas</div><div class="time" id="tMain">45:00</div><div class="bar"><i id="pMain"></i></div></div>
 <div class="row dur" id="dur"><button data-m="30">30 min</button><button data-m="45">45 min</button><button data-m="60">60 min</button></div>
 <button class="big" id="bSit">Sėdžiu</button>
 <div class="row"><button class="sec hidden" id="bStop">Sustabdyti</button><button class="sec" id="bBreak">Pertrauka</button></div>
 <p class="hint">Kad signalas tikrai suskambėtų, laikyk programėlę atidarytą</p>
</section>
<section id="vAlarm" class="hidden"><div class="card alarm"><div class="emo">⏰</div><div style="font-size:1.6rem;font-weight:600">Laikas pertraukai!</div></div>
 <button class="big" id="bStartBreak">Pertrauka</button><button class="sec" id="bSnooze">Atidėti 5 min</button></section>
<section id="vEx" class="hidden"><div class="card">
 <div class="mu" id="exN"></div><svg id="exFig" viewBox="25 22 170 182" aria-hidden="true"></svg><h2 id="exT" style="margin:6px 0"></h2>
 <p id="exD" style="font-size:1.15rem;line-height:1.45"></p><div class="time" id="exTime"></div><div class="bar"><i id="pEx"></i></div></div>
 <div class="row"><button class="sec" id="bSkip">Praleisti</button><button class="big" style="padding:18px;font-size:1.3rem" id="bNext">Kitas</button></div>
 <button class="sec" id="bEndBreak">Baigti pertrauką</button></section>
<section id="vDone" class="hidden"><div class="card"><div class="emo">🎉</div><h2>Puiku! Pertrauka baigta.</h2><div class="mu" id="doneLbl"></div></div><button class="big" id="bAgain">Sėdžiu vėl</button><button class="sec" id="bRest">Baigiu darbą</button></section>
</main><script>
const TEST=new URLSearchParams(location.search).has('test');
const EX=[["🙆","Kaklo pakreipimai",30,"Lėtai lenk ausį prie peties, po 3 kartus į abi puses. Pečiai lieka nuleisti.","neck"],
["🔄","Pečių suktukai",20,"Suk pečius atgal dideliais lėtais apskritimais.","roll"],
["🤸","Mentės kartu",30,"Suspausk mentes, palaikyk 3 sekundes ir atleisk, 8 kartus.","blade"],
["🪑","Atsistojimai",40,"10 pritūpimų arba atsistojimų nuo kėdės.","squat"],
["🧱","Atsispaudimai nuo sienos",40,"10 atsispaudimų nuo sienos.","wall"],
["🧍","Nugaros atsilenkimas stovint",20,"Rankos ant juosmens, švelniai atsilenk atgal, 5 kartus.","back"],
["👀","Akių poilsis",20,"20 sekundžių žiūrėk į tolimą tašką pro langą.","eye"],
["🚶","Pasivaikščiojimas ir vanduo",30,"Pasivaikščiok po kambarį ir išgerk gurkšnį vandens.","walk"]];
const $=id=>document.getElementById(id);
// ---- Pratimų animacijos ----
const mod=(b,c)=>({...b,...c}),mv=(b,dx,dy=0)=>Object.fromEntries(Object.entries(b).map(([k,[x,y]])=>[k,[x+dx,y+dy]]));
const lim=(S,E1,W1,E2,W2,P,K1,F1,K2,F2)=>({S1:S,S2:S,E1,W1,E2,W2,P1:P,P2:P,K1,F1,K2,F2});
const FB={H:[100,40],N:[100,58],S1:[80,64],S2:[120,64],E1:[74,95],E2:[126,95],W1:[72,124],W2:[128,124],P1:[90,128],P2:[110,128],K1:[89,163],K2:[111,163],F1:[88,198],F2:[112,198]};
const SB={H:[104,40],N:[100,58],...lim([100,64],[104,95],[110,122],[97,95],[93,122],[100,128],[101,163],[102,198],[99,163],[98,198])};
const roll=(dx,dy)=>mod(SB,{S1:[100+dx,64+dy],S2:[100+dx,64+dy],E1:[104+dx,95+dy],E2:[97+dx,95+dy],W1:[110+dx,122+dy],W2:[93+dx,122+dy]});
const PR={ground:'<path class="pr" d="M38 200H182"/>',chair:'<path class="pr" d="M64 118V199M64 166H98V199"/>',wall:'<path class="pr" d="M153 30V199M153 50l8-8M153 80l8-8M153 110l8-8M153 140l8-8M153 170l8-8"/>',
 window:'<path class="pr" d="M150 34h38v44h-38zM169 34v44M150 56h38"/><line class="sl" x1="92" y1="40" x2="150" y2="52"/>'};
PR.arc='<path class="pr" d="M118 52A20 20 0 1 0 120 76"/><path class="pr" d="M112 50l7 2-3 7"/>';
const ANIM={
 neck:{side:0,d:900,h:500,f:[FB,mod(FB,{H:[86,45]}),FB,mod(FB,{H:[114,45]})]},
 roll:{side:1,d:380,h:0,p:'arc',f:[roll(0,-9),roll(-8,0),roll(0,7),roll(8,0)]},
 blade:{side:1,d:1000,h:1200,f:[mod(SB,{E1:[110,92],E2:[107,92],W1:[130,80],W2:[127,80]}),mod(SB,{S1:[96,64],S2:[96,64],H:[103,40],E1:[82,90],E2:[80,90],W1:[102,76],W2:[100,76]})]},
 squat:{side:1,d:1300,h:250,p:'chair',f:[{H:[106,76],N:[100,94],...lim([100,100],[116,124],[134,120],[114,124],[131,121],[84,160],[118,162],[119,198],[116,162],[116,198])},
  {H:[120,40],N:[116,58],...lim([116,64],[128,92],[146,96],[126,92],[143,97],[112,128],[118,163],[119,198],[116,163],[116,198])}]},
 wall:{side:1,d:1100,h:150,p:'wall',f:[{H:[110,50],N:[103,66],...lim([102,70],[126,76],[150,80],[125,78],[149,83],[84,128],[73,163],[62,198],[71,163],[60,198])},
  {H:[133,64],N:[124,80],...lim([122,84],[134,102],[150,80],[132,104],[149,83],[95,133],[78,165],[62,198],[76,165],[60,198])}]},
 back:{side:1,d:1500,h:600,f:[mod(SB,{E1:[89,100],E2:[87,100],W1:[96,124],W2:[94,124]}),mod(SB,{H:[88,43],N:[93,60],S1:[92,66],S2:[92,66],E1:[79,102],E2:[77,102],W1:[92,124],W2:[90,124],P1:[103,128],P2:[103,128]})]},
 eye:{side:1,d:2200,h:800,p:'window',f:[mv(SB,-24),mv(mod(SB,{H:[105,39]}),-24)]},
 walk:{side:1,d:480,h:0,f:[mod(SB,{P1:[100,131],P2:[100,131],K1:[109,164],F1:[121,197],K2:[93,165],F2:[81,197],E1:[95,94],W1:[88,120],E2:[106,94],W2:[115,119]}),
  mod(SB,{P1:[100,131],P2:[100,131],K2:[109,164],F2:[121,197],K1:[93,165],F1:[81,197],E2:[95,94],W2:[88,120],E1:[106,94],W1:[115,119]})]}};
const SEG=[['N','S2'],['S2','E2'],['E2','W2'],['P2','K2'],['K2','F2'],['N','PM'],['P1','P2'],['N','S1'],['S1','E1'],['E1','W1'],['P1','K1'],['K1','F1'],['H','N']];
let raf=0;
function stopAnim(){cancelAnimationFrame(raf);raf=0}
function startAnim(k){stopAnim();const a=ANIM[k],svg=$('exFig');if(!a){svg.innerHTML='';return}
 svg.innerHTML=PR.ground+(a.p?PR[a.p]:'')+SEG.map(([u,v])=>`<line class="fg${a.side&&(u+v).includes('2')?' bk':''}"/>`).join('')+'<circle class="hd" r="13"/>';
 const L=[...svg.querySelectorAll('line.fg')],C=svg.querySelector('.hd'),n=a.f.length,seg=a.d+a.h,t0=performance.now();
 const draw=now=>{const el=(now-t0)%(seg*n),i=Math.floor(el/seg),u0=Math.min(1,(el-i*seg)/a.d),u=.5-.5*Math.cos(Math.PI*u0),A=a.f[i],B=a.f[(i+1)%n];
  const q=k=>k==='PM'?[(q('P1')[0]+q('P2')[0])/2,(q('P1')[1]+q('P2')[1])/2]:[A[k][0]+(B[k][0]-A[k][0])*u,A[k][1]+(B[k][1]-A[k][1])*u];
  SEG.forEach(([s1,s2],j)=>{const p=q(s1),r=q(s2);L[j].setAttribute('x1',p[0]);L[j].setAttribute('y1',p[1]);L[j].setAttribute('x2',r[0]);L[j].setAttribute('y2',r[1])});
  const h=q('H');C.setAttribute('cx',h[0]);C.setAttribute('cy',h[1]);raf=requestAnimationFrame(draw)};
 raf=requestAnimationFrame(draw)}

let mins=+localStorage.getItem('pert_min')||45, end=0, tick=null, wl=null, ac=null, alarmInt=null, exI=0, exEnd=0, exDur=0, auto=null, sitSec=0;
const total=()=>TEST?10:mins*60;
const SNOOZE=()=>TEST?5:300;
const fmt=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function show(v){if(v!=='vEx')stopAnim();['vHome','vAlarm','vEx','vDone'].forEach(x=>$(x).classList.toggle('hidden',x!==v))}
function audio(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function beep(f=880,d=.15,v=.5,t0=0){try{const a=audio(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type='square';o.frequency.value=f;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.setValueAtTime(v,t+d-.02);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.01)}catch(e){}}
async function wake(on){try{if(on&&'wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}else if(!on&&wl){await wl.release();wl=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(end||exEnd))wake(true)});
function renderDur(){document.querySelectorAll('#dur button').forEach(b=>{b.classList.toggle('on',+b.dataset.m===mins);b.disabled=!!end});if(!end){$('tMain').textContent=fmt(total());$('pMain').style.width='0'}}
$('dur').onclick=e=>{const m=+e.target.dataset.m;if(!m||end)return;mins=m;localStorage.setItem('pert_min',m);renderDur()};
function startSit(sec){if(end)return;clearAuto();stopAlarm();audio();sitSec=sec||total();if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
 end=Date.now()+sitSec*1000;renderDur();wake(true);show('vHome');$('bStop').classList.remove('hidden');$('bSit').textContent='Sėdžiu…';$('stLbl').textContent='Iki pertraukos';
 clearInterval(tick);tick=setInterval(upd,250);upd()}
function upd(){const left=(end-Date.now())/1000;$('tMain').textContent=fmt(left);$('pMain').style.width=(100*(1-left/sitSec))+'%';if(left<=0)fire()}
function stopSit(){clearInterval(tick);end=0;wake(false);$('bStop').classList.add('hidden');$('bSit').textContent='Sėdžiu';$('stLbl').textContent='Sėdėjimo laikas';renderDur()}
function fire(){stopSit();show('vAlarm');document.title='⏰ Pertrauka!';
 const ring=()=>{[0,.2,.4].forEach(t=>beep(988,.15,.9,t));beep(1319,.3,.9,.6);navigator.vibrate&&navigator.vibrate([400,150,400,150,400])};ring();alarmInt=setInterval(ring,1500);
 try{if('Notification' in window&&Notification.permission==='granted'){const o={body:'Laikas atsistoti ir pajudėti!',icon:'icon-192.png',vibrate:[400,150,400],requireInteraction:true,tag:'pert'};
  navigator.serviceWorker&&navigator.serviceWorker.controller?navigator.serviceWorker.ready.then(r=>r.showNotification('Pertrauka!',o)):new Notification('Pertrauka!',o)}}catch(e){}}
function stopAlarm(){clearInterval(alarmInt);alarmInt=null;navigator.vibrate&&navigator.vibrate(0);document.title='Pertraukos'}
function startBreak(){stopAlarm();stopSit();audio();wake(true);exI=0;showEx()}
function showEx(){if(exI>=EX.length){clearInterval(tick);exEnd=0;wake(false);[0,.2,.4].forEach((t,i)=>beep(660+i*220,.18,.5,t));finishBreak();return}
 const [e,t,s,d,k]=EX[exI];exDur=TEST?3:s;$('exN').textContent=`${e} Pratimas ${exI+1} iš ${EX.length} · ${s} s`;startAnim(k);$('exT').textContent=t;$('exD').textContent=d;
 $('bNext').textContent=exI===EX.length-1?'Baigti':'Kitas';show('vEx');exEnd=Date.now()+exDur*1000;clearInterval(tick);tick=setInterval(updEx,250);updEx()}
function updEx(){const left=(exEnd-Date.now())/1000;$('exTime').textContent=fmt(left);$('pEx').style.width=(100*(1-left/exDur))+'%';if(left<=0){clearInterval(tick);beep(880,.25,.6);navigator.vibrate&&navigator.vibrate(200);$('exTime').textContent='Atlikta ✓'}}
function clearAuto(){clearInterval(auto);auto=null}
function finishBreak(){clearInterval(tick);exEnd=0;show('vDone');let n=10;const lbl=()=>$('doneLbl').textContent=`Sėdėjimo laikmatis pasileis po ${n} s`;lbl();
 clearAuto();auto=setInterval(()=>{n--;if(n<=0){clearAuto();startSit()}else lbl()},1000)}
function rest(){clearAuto();stopSit();wake(false);show('vHome')}
function next(){beep(660,.12,.5);exI++;showEx()}
$('bSit').onclick=()=>startSit();$('bStop').onclick=stopSit;$('bBreak').onclick=startBreak;$('bStartBreak').onclick=startBreak;
$('bSnooze').onclick=()=>startSit(SNOOZE());$('bEndBreak').onclick=()=>{beep(660,.12,.5);finishBreak()};$('bRest').onclick=rest;$('bNext').onclick=next;$('bSkip').onclick=next;$('bAgain').onclick=()=>startSit();
renderDur();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
