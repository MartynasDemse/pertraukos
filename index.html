<!doctype html><html lang="lt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f7d6d"><title>Pertraukos</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3f6f4;--card:#fff;--tx:#1d2b27;--mu:#5d6f69;--ac:#2f7d6d;--ac2:#e0efe9;--wr:#c0563b}
@media(prefers-color-scheme:dark){:root{--bg:#14201d;--card:#1d2c28;--tx:#e6efec;--mu:#9db0aa;--ac:#4fb39c;--ac2:#25403a;--wr:#e67e5f}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:24px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
h1{margin:4px 0;font-size:1.5rem;font-weight:600;text-align:center}
.card{background:var(--card);border-radius:24px;padding:22px;text-align:center;box-shadow:0 2px 12px #0001}
.time{font-size:4.2rem;font-weight:300;font-variant-numeric:tabular-nums;margin:6px 0}
.mu{color:var(--mu)}button{font:inherit;border:0;border-radius:18px;cursor:pointer}
.big{width:100%;padding:26px;font-size:1.7rem;font-weight:600;background:var(--ac);color:#fff}
.sec{width:100%;padding:18px;font-size:1.2rem;background:var(--ac2);color:var(--tx)}
.row{display:flex;gap:10px}.row>*{flex:1}
.dur button{padding:14px;font-size:1.1rem;background:var(--ac2);color:var(--tx)}.dur button.on{background:var(--ac);color:#fff}
.hint{font-size:.95rem;color:var(--mu);text-align:center;padding:0 8px}
.alarm{background:var(--wr);color:#fff;animation:p 1s infinite}@keyframes p{50%{opacity:.75}}
.emo{font-size:5rem;line-height:1.2}.hidden{display:none!important}
.bar{height:8px;background:var(--ac2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0}
</style></head><body><main>
<h1>Pertraukos</h1>
<section id="vHome">
 <div class="card"><div class="mu" id="stLbl">Sėdėjimo laikas</div><div class="time" id="tMain">45:00</div><div class="bar"><i id="pMain"></i></div></div>
 <p></p><div class="row dur" id="dur"><button data-m="30">30 min</button><button data-m="45">45 min</button><button data-m="60">60 min</button></div><p></p>
 <button class="big" id="bSit">Sėdžiu</button><p></p>
 <div class="row"><button class="sec hidden" id="bStop">Sustabdyti</button><button class="sec" id="bBreak">Pertrauka</button></div>
 <p class="hint">Kad signalas tikrai suskambėtų, laikyk programėlę atidarytą</p>
</section>
<section id="vAlarm" class="hidden"><div class="card alarm"><div class="emo">⏰</div><div style="font-size:1.6rem;font-weight:600">Laikas pertraukai!</div></div><p></p>
 <button class="big" id="bStartBreak">Pertrauka</button><p></p><button class="sec" id="bSnooze">Išjungti signalą</button></section>
<section id="vEx" class="hidden"><div class="card">
 <div class="mu" id="exN"></div><div class="emo" id="exE"></div><h2 id="exT" style="margin:6px 0"></h2>
 <p id="exD" style="font-size:1.15rem;line-height:1.45"></p><div class="time" id="exTime"></div><div class="bar"><i id="pEx"></i></div></div><p></p>
 <div class="row"><button class="sec" id="bSkip">Praleisti</button><button class="big" style="padding:18px;font-size:1.3rem" id="bNext">Kitas</button></div></section>
<section id="vDone" class="hidden"><div class="card"><div class="emo">🎉</div><h2>Puiku! Pertrauka baigta.</h2></div><p></p><button class="big" id="bAgain">Sėdžiu vėl</button></section>
</main><script>
const TEST=new URLSearchParams(location.search).has('test');
const EX=[["🙆","Kaklo pakreipimai",30,"Lėtai lenk ausį prie peties, po 3 kartus į abi puses. Pečiai lieka nuleisti."],
["🔄","Pečių suktukai",20,"Suk pečius atgal dideliais lėtais apskritimais."],
["🤸","Mentės kartu",30,"Suspausk mentes, palaikyk 3 sekundes ir atleisk, 8 kartus."],
["🪑","Atsistojimai",40,"10 pritūpimų arba atsistojimų nuo kėdės."],
["🧱","Atsispaudimai nuo sienos",40,"10 atsispaudimų nuo sienos."],
["🧍","Nugaros atsilenkimas stovint",20,"Rankos ant juosmens, švelniai atsilenk atgal, 5 kartus."],
["👀","Akių poilsis",20,"20 sekundžių žiūrėk į tolimą tašką pro langą."],
["🚶","Pasivaikščiojimas ir vanduo",30,"Pasivaikščiok po kambarį ir išgerk gurkšnį vandens."]];
const $=id=>document.getElementById(id);
let mins=+localStorage.getItem('pert_min')||45, end=0, tick=null, wl=null, ac=null, alarmInt=null, exI=0, exEnd=0, exDur=0;
const total=()=>TEST?10:mins*60;
const fmt=s=>{s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function show(v){['vHome','vAlarm','vEx','vDone'].forEach(x=>$(x).classList.toggle('hidden',x!==v))}
function audio(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac}
function beep(f=880,d=.15,v=.5,t0=0){try{const a=audio(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type='square';o.frequency.value=f;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.setValueAtTime(v,t+d-.02);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.01)}catch(e){}}
async function wake(on){try{if(on&&'wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}else if(!on&&wl){await wl.release();wl=null}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(end||exEnd))wake(true)});
function renderDur(){document.querySelectorAll('#dur button').forEach(b=>b.classList.toggle('on',+b.dataset.m===mins));if(!end){$('tMain').textContent=fmt(total());$('pMain').style.width='0'}}
$('dur').onclick=e=>{const m=+e.target.dataset.m;if(!m)return;mins=m;localStorage.setItem('pert_min',m);renderDur()};
function startSit(){stopAlarm();audio();if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
 end=Date.now()+total()*1000;wake(true);show('vHome');$('bStop').classList.remove('hidden');$('bSit').textContent='Sėdžiu…';$('stLbl').textContent='Iki pertraukos';
 clearInterval(tick);tick=setInterval(upd,250);upd()}
function upd(){const left=(end-Date.now())/1000;$('tMain').textContent=fmt(left);$('pMain').style.width=(100*(1-left/total()))+'%';if(left<=0)fire()}
function stopSit(){clearInterval(tick);end=0;wake(false);$('bStop').classList.add('hidden');$('bSit').textContent='Sėdžiu';$('stLbl').textContent='Sėdėjimo laikas';renderDur()}
function fire(){stopSit();show('vAlarm');document.title='⏰ Pertrauka!';
 const ring=()=>{[0,.2,.4].forEach(t=>beep(988,.15,.9,t));beep(1319,.3,.9,.6);navigator.vibrate&&navigator.vibrate([400,150,400,150,400])};ring();alarmInt=setInterval(ring,1500);
 try{if('Notification' in window&&Notification.permission==='granted'){const o={body:'Laikas atsistoti ir pajudėti!',icon:'icon-192.png',vibrate:[400,150,400],requireInteraction:true,tag:'pert'};
  navigator.serviceWorker&&navigator.serviceWorker.controller?navigator.serviceWorker.ready.then(r=>r.showNotification('Pertrauka!',o)):new Notification('Pertrauka!',o)}}catch(e){}}
function stopAlarm(){clearInterval(alarmInt);alarmInt=null;navigator.vibrate&&navigator.vibrate(0);document.title='Pertraukos'}
function startBreak(){stopAlarm();stopSit();audio();wake(true);exI=0;showEx()}
function showEx(){if(exI>=EX.length){clearInterval(tick);exEnd=0;wake(false);[0,.2,.4].forEach((t,i)=>beep(660+i*220,.18,.5,t));show('vDone');return}
 const [e,t,s,d]=EX[exI];exDur=TEST?3:s;$('exN').textContent=`Pratimas ${exI+1} iš ${EX.length} · ${s} s`;$('exE').textContent=e;$('exT').textContent=t;$('exD').textContent=d;
 $('bNext').textContent=exI===EX.length-1?'Baigti':'Kitas';show('vEx');exEnd=Date.now()+exDur*1000;clearInterval(tick);tick=setInterval(updEx,250);updEx()}
function updEx(){const left=(exEnd-Date.now())/1000;$('exTime').textContent=fmt(left);$('pEx').style.width=(100*(1-left/exDur))+'%';if(left<=0){clearInterval(tick);beep(880,.25,.6);navigator.vibrate&&navigator.vibrate(200);$('exTime').textContent='Atlikta ✓'}}
function next(){beep(660,.12,.5);exI++;showEx()}
$('bSit').onclick=startSit;$('bStop').onclick=stopSit;$('bBreak').onclick=startBreak;$('bStartBreak').onclick=startBreak;
$('bSnooze').onclick=()=>{stopAlarm();show('vHome')};$('bNext').onclick=next;$('bSkip').onclick=next;$('bAgain').onclick=startSit;
renderDur();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
